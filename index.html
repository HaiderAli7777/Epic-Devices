<style>
  html,body{margin:0;padding:0;background:#F4F6FA;-webkit-text-size-adjust:100%;}
  #boot{position:fixed;inset:0;display:grid;place-items:center;background:#F4F6FA;z-index:9999;
        font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#5C6B87;gap:14px;}
  #boot .m{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#1657DC,#22D3EE);
           display:grid;place-items:center;animation:bp 1.4s ease-in-out infinite;}
  #boot .m svg{width:22px;height:22px;fill:#fff;}
  #boot p{margin:0;font-size:13px;letter-spacing:.02em;}
  @keyframes bp{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.9);opacity:.72}}
  @media (prefers-reduced-motion:reduce){#boot .m{animation:none}}
  noscript{display:block;padding:40px;text-align:center;font-family:system-ui,sans-serif;color:#101828;}
</style>
